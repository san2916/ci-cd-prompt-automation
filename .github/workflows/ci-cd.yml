name: CI/CD Prompt Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Run automation
        run: |
          python scripts/automation.py

      - name: Generate dashboard and report
        run: |
          python scripts/generate_report.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: reports/

      - name: Update Agile task - Success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGILE_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body: 'CI/CD pipeline completed successfully. Agile status: DONE.'
            });

      - name: Update Agile task - Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGILE_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body: 'CI/CD pipeline failed. Agile status: BLOCKED. Please review the workflow logs.'
            });

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
